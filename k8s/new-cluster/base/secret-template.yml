  db.user: "taxonworks"
  db.password: "CHANGE_ME"
  
  # Rails secret key base - generate with: rails secret
  secret_key_base: "GENERATE_WITH_RAILS_SECRET"
  
  # Nginx secret key
  nginx.secret: "GENERATE_RANDOM_STRING"