apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taxonworks-ingress
  annotations:
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"  # If using cert-manager
spec:
  ingressClassName: nginx  # or whatever ingress controller you're using
  rules:
    - host: taxonworks.example.com  # Update this
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taxonworks
                port:
                  number: 80
  # tls:
  #   - hosts:
  #       - taxonworks.example.com
  #     secretName: taxonworks-tls