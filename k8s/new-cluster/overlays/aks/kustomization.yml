apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- shared-pvc.yml

namespace: development

patchesStrategicMerge:
- configmap.yml
- ingress.yml
- app.yml
- postgres.yml
- remove-pvcs.yml

# Configure local registry image for AKS deployment
images:
- name: sfgrp/taxonworks
  newName: registry.48.216.156.172.sslip.io/taxonworks
  newTag: k8s-test

# Use replacements to swap out the PVC names in the app deployment
replacements:
- source:
    kind: PersistentVolumeClaim
    name: shared-dev-storage
  targets:
  - select:
      kind: Deployment
      name: taxonworks
    fieldPaths:
    - spec.template.spec.volumes.[name=taxonworks-media-vol].persistentVolumeClaim.claimName
    - spec.template.spec.volumes.[name=taxonworks-backup-vol].persistentVolumeClaim.claimName
    - spec.template.spec.volumes.[name=taxonworks-staging-vol].persistentVolumeClaim.claimName
